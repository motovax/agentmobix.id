name: Deploy Cloudflare Worker

# Deploys the API proxy + Open Graph share cards (worker/).
# Runs when worker/ changes or on demand.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   MOBIX_API_KEY
# Optional:
#   STRAPI_API_KEY
#   DSF_BEARER_TOKEN

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload MOBIX_API_KEY secret
        working-directory: worker
        run: echo "$MOBIX_API_KEY" | npx wrangler secret put MOBIX_API_KEY --name agentmobix-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOBIX_API_KEY: ${{ secrets.MOBIX_API_KEY }}

      - name: Upload STRAPI_API_KEY secret
        continue-on-error: true
        working-directory: worker
        run: |
          if [ -n "$STRAPI_API_KEY" ]; then
            echo "$STRAPI_API_KEY" | npx wrangler secret put STRAPI_API_KEY --name agentmobix-api
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRAPI_API_KEY: ${{ secrets.STRAPI_API_KEY }}

      - name: Upload DSF_BEARER_TOKEN secret
        continue-on-error: true
        working-directory: worker
        run: |
          if [ -n "$DSF_BEARER_TOKEN" ]; then
            echo "$DSF_BEARER_TOKEN" | npx wrangler secret put DSF_BEARER_TOKEN --name agentmobix-api
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DSF_BEARER_TOKEN: ${{ secrets.DSF_BEARER_TOKEN }}
