name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_MOBIX_API_KEY: ${{ vars.VITE_MOBIX_API_KEY }}
          VITE_MOBIX_MRP_API_KEY: ${{ vars.VITE_MOBIX_MRP_API_KEY || vars.VITE_MOBIX_API_KEY }}
          VITE_MOBIX_API_BASE: ${{ vars.VITE_MOBIX_API_BASE || 'https://mobix.motovax.com' }}
          VITE_MOBIX_IMAGE_BASE: ${{ vars.VITE_MOBIX_IMAGE_BASE || 'https://mobix.motovax.com' }}
          VITE_MOTOVAX_AUTH_API_BASE: ${{ vars.VITE_MOTOVAX_AUTH_API_BASE || 'https://mobix.motovax.com' }}
          VITE_AGENT_USER_AGENT_TOKENS: ${{ vars.VITE_AGENT_USER_AGENT_TOKENS || 'AgenMobix,AgentMobix' }}
          VITE_STRAPI_API_KEY: ${{ vars.VITE_STRAPI_API_KEY }}
          VITE_CMS_API_BASE: ${{ vars.VITE_CMS_API_BASE || 'https://api.mobixbydss.id/api' }}
          VITE_CMS_IMAGE_BASE: ${{ vars.VITE_CMS_IMAGE_BASE || 'https://api.mobixbydss.id' }}
          VITE_DSF_BEARER_TOKEN: ${{ vars.VITE_DSF_BEARER_TOKEN }}
          VITE_DSF_BASE_URL: ${{ vars.VITE_DSF_BASE_URL || 'https://simulation.dipostar.com' }}
          VITE_FALCON_API_BASE: ${{ vars.VITE_FALCON_API_BASE || 'https://motovax-ai.motovax.com' }}
          VITE_FALCON_SSE_URL: ${{ vars.VITE_FALCON_SSE_URL || 'https://motovax-ai.motovax.com/api/falcon/external/stream' }}
          VITE_FALCON_CLIENT: ${{ vars.VITE_FALCON_CLIENT || 'mobix' }}
          VITE_FALCON_TOKEN: ${{ secrets.VITE_FALCON_TOKEN }}

      - name: Verify Falcon configuration
        env:
          VITE_FALCON_TOKEN: ${{ secrets.VITE_FALCON_TOKEN }}
        run: test -n "$VITE_FALCON_TOKEN"

      - name: SPA fallback (client-side routing on Pages)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
